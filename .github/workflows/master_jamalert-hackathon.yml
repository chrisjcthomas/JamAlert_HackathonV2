# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - jamalert-hackathon

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './backend' # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x' # set this to the node version to use (supports 8.x, 10.x, 12.x)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'Resolve Project Dependencies Using Npm'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm install
          npx prisma generate
          npm run build --if-present
          popd

      - name: Prepare deployment package
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          # Create deployment directory
          mkdir -p $GITHUB_WORKSPACE/deploy
          # Copy compiled output maintaining dist structure
          cp -r dist $GITHUB_WORKSPACE/deploy/
          # Copy necessary files
          cp host.json $GITHUB_WORKSPACE/deploy/
          cp package.json $GITHUB_WORKSPACE/deploy/
          cp -r node_modules $GITHUB_WORKSPACE/deploy/
          cp -r prisma $GITHUB_WORKSPACE/deploy/
          [ -f .funcignore ] && cp .funcignore $GITHUB_WORKSPACE/deploy/ || true
          # Update package.json main field to point to correct location
          cd $GITHUB_WORKSPACE/deploy
          node -e "const pkg=require('./package.json'); pkg.main='dist/src/index.js'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"
      
      - name: Zip artifact for deployment
        run: |
          cd $GITHUB_WORKSPACE/deploy
          zip -r $GITHUB_WORKSPACE/release.zip . -x '*.git*' 'coverage/*' 'tests/*' '*.test.*' '*/__tests__/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_37725B27674842AAB9BC39D6E8C80B4F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DBE13D6A8AAA4E4C9B54E482358BEF60 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E9E1C9EE8D2B4EC4B0C38E9E6040D21A }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'jamalert-hackathon'
          slot-name: 'Production'
          package: '.'
          